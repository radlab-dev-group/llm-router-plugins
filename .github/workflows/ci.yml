name: CI

# The full test suite on every branch push and again on the merge into main.
# One matrix cell per supported interpreter: the package pins 3.10+ and is
# exercised on the newest two interpreters, so a change that leans on a
# removed stdlib behaviour or an interpreter-specific quirk is caught on
# the version a deployment is most likely to run.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            setup.py
            requirements-extra.txt

      - name: Install package and test dependencies
        # The package plus what the test suites import beyond it: the
        # agentic-knowledge extras (SSE client, stream backend) and the
        # embedding stack conftest reaches for.  The Redis-backed integration
        # tests stay skipped on purpose — they opt in with
        # CODEX_ROUTING_REDIS_URL and belong in a service job, not here.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[agentic-knowledge] pytest numpy scipy sentence-transformers

      - name: Run the test suite
        run: python -m pytest tests/ -q -rs
